<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Focus Sounds">
<meta name="description" content="Procedural white, brown, rain and ocean sounds for focus.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Focus Sounds</title>
<style>
:root{--accent:#2DD4BF;--bg:#04120F;--card:#0A2420;--text:#EFFFFB;--dim:#7FB5AB;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100dvh}
.app{width:min(480px,100vw - 24px);height:100dvh;max-height:780px;display:flex;flex-direction:column;padding:16px 14px 12px}
header{text-align:center;margin-bottom:10px}
header h1{font-size:22px;letter-spacing:.06em;color:var(--accent)}
#status{font-size:14px;color:var(--dim);margin-top:4px}
#status b{color:var(--accent)}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:0;margin-bottom:10px}
.snd{background:var(--card);border:1px solid #16443D;color:var(--text);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:48px;font-size:17px;cursor:pointer;outline:none}
.snd .ico{font-size:34px}
.snd[data-focusable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.snd.on{background:var(--accent);color:#04120F;border-color:var(--accent)}
.snd.on .desc{color:#04120F}
.snd .desc{font-size:12px;color:var(--dim)}
#stop{background:#3A1A1A;border:1px solid #7A3A3A;color:#FF9B9B;border-radius:16px;
  min-height:64px;font-size:18px;font-weight:800;cursor:pointer}
#stop[data-focusable]:focus-visible{outline:2px solid #FF6B6B;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>FOCUS SOUNDS</h1>
    <div id="status">Playing: <b>none</b></div>
  </header>
  <div class="grid">
    <button class="snd" data-sound="white" data-focusable><span class="ico">&#10052;</span>White<span class="desc">steady hiss</span></button>
    <button class="snd" data-sound="brown" data-focusable><span class="ico">&#127754;</span>Brown<span class="desc">deep rumble</span></button>
    <button class="snd" data-sound="rain" data-focusable><span class="ico">&#127783;</span>Rain<span class="desc">soft patter</span></button>
    <button class="snd" data-sound="ocean" data-focusable><span class="ico">&#127755;</span>Ocean<span class="desc">slow waves</span></button>
  </div>
  <button id="stop" data-focusable>&#9209; Stop</button>
</div>
<script>
(function(){
"use strict";
var ctx=null,nodes=null,current=null;
var SR_SECONDS=4;
function ensureCtx(){
  if(!ctx){
    var AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
  }
  if(ctx.state==="suspended")ctx.resume();
  return ctx;
}
function whiteBuffer(c){
  var len=Math.floor(c.sampleRate*SR_SECONDS);
  var b=c.createBuffer(1,len,c.sampleRate);
  var d=b.getChannelData(0),i;
  for(i=0;i<len;i++)d[i]=Math.random()*2-1;
  return b;
}
function brownBuffer(c){
  var len=Math.floor(c.sampleRate*SR_SECONDS);
  var b=c.createBuffer(1,len,c.sampleRate);
  var d=b.getChannelData(0),i,last=0,peak=0;
  for(i=0;i<len;i++){
    var w=Math.random()*2-1;
    last=0.98*last+0.02*w;
    d[i]=last;
    if(Math.abs(last)>peak)peak=Math.abs(last);
  }
  if(peak>0){for(i=0;i<len;i++)d[i]=d[i]/peak*0.9;}
  return b;
}
function stopAll(){
  if(nodes){
    try{
      nodes.src.stop();
      nodes.root.disconnect();
    }catch(e){}
    nodes=null;
  }
  current=null;
  updateUI();
}
function lfo(c,freq,depth,center,param,startWhen){
  var osc=c.createOscillator();osc.type="sine";osc.frequency.value=freq;
  var g=c.createGain();g.gain.value=depth;
  osc.connect(g);g.connect(param);
  osc.start(startWhen);
  return osc;
}
function play(kind){
  var c=ensureCtx();
  stopAll();
  var src=c.createBufferSource();
  var root=c.createGain();root.gain.value=0.6;
  var keep=[src,root];
  if(kind==="white"){
    src.buffer=whiteBuffer(c);src.loop=true;src.connect(root);
  }else if(kind==="brown"){
    src.buffer=brownBuffer(c);src.loop=true;src.connect(root);
  }else if(kind==="rain"){
    src.buffer=whiteBuffer(c);src.loop=true;
    var lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1200;
    var amp=c.createGain();amp.gain.value=0.75;
    src.connect(lp);lp.connect(amp);amp.connect(root);
    keep.push(lp,amp);
    keep.push(lfo(c,0.15,0.25,0,amp.gain,c.currentTime));
  }else if(kind==="ocean"){
    src.buffer=brownBuffer(c);src.loop=true;
    var lp2=c.createBiquadFilter();lp2.type="lowpass";lp2.frequency.value=650;
    src.connect(lp2);lp2.connect(root);
    keep.push(lp2);
    keep.push(lfo(c,0.1,250,0,lp2.frequency,c.currentTime));
  }
  root.connect(c.destination);
  src.start();
  nodes={src:src,root:root,keep:keep};
  current=kind;
  updateUI();
}
var labels={white:"White",brown:"Brown",rain:"Rain",ocean:"Ocean"};
var btns=Array.prototype.slice.call(document.querySelectorAll(".snd"));
function updateUI(){
  btns.forEach(function(b){
    if(b.getAttribute("data-sound")===current)b.classList.add("on");
    else b.classList.remove("on");
  });
  document.getElementById("status").innerHTML="Playing: <b>"+(current?labels[current]:"none")+"</b>";
}
btns.forEach(function(b){
  b.addEventListener("click",function(){
    var k=b.getAttribute("data-sound");
    if(current===k)stopAll();else play(k);
  });
});
document.getElementById("stop").addEventListener("click",stopAll);
document.addEventListener("keydown",function(e){
  var f=btns.concat([document.getElementById("stop")]);
  var i=f.indexOf(document.activeElement);
  if(e.key==="Enter"&&i>=0){e.preventDefault();f[i].click();return;}
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();f[(i+1+f.length)%f.length].focus();}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();f[(i-1+f.length)%f.length].focus();}
});
btns[0].focus();
})();
</script>
</body>
</html>
